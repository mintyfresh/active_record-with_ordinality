name: Release

on:
  push:
    tags: ['v*']

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to RubyGems
    needs: ci
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write # exchanged for a RubyGems API key by trusted publishing

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - name: Check tag matches gem version
        run: |
          version=$(ruby -r ./lib/active_record/with_ordinality/version -e 'print ActiveRecord::WithOrdinality::VERSION')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match gem version ${version}"
            exit 1
          fi
      # A new gem must be pushed with credentials asserting which account owns it (GHSA-48p7-6mjr-3jjj).
      # rubygems/release-gem can't pass the owner yet, so the OIDC token is exchanged here instead,
      # as rubygems/configure-rubygems-credentials does (plus the owner). Remove once the action supports it.
      - name: Configure trusted publishing credentials
        env:
          RUBYGEMS_OWNER: "148377" # immutable ID of the RubyGems.org account which owns the gem
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r ".value")
          response=$(jq -n --arg jwt "${jwt}" --arg owner "${RUBYGEMS_OWNER}" "{jwt: \$jwt, owner: \$owner}" |
            curl -sS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
              -H "Content-Type: application/json" -H "Accept: application/json" --data @-)
          api_key=$(jq -r ".rubygems_api_key // empty" <<< "${response}")
          if [ -z "${api_key}" ]; then
            echo "::error::Failed to exchange the OIDC token for a RubyGems API key: ${response}"
            exit 1
          fi
          echo "::add-mask::${api_key}"
          {
            echo "RUBYGEMS_API_KEY=${api_key}"
            echo "BUNDLE_GEM__PUSH_KEY=${api_key}"
            echo "GEM_HOST_API_KEY=${api_key}"
          } >> "${GITHUB_ENV}"
      # Builds and pushes the gem with `rake release` (which skips tagging, since the tag already exists)
      - uses: rubygems/release-gem@v1
        with:
          setup-trusted-publisher: false
